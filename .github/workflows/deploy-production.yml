name: "Deploy MMD Production"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmd-production
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.4"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build

  migrate:
    name: Migrate Neon database
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check database credentials
        run: test -n "$DATABASE_URL"
      - run: bun --cwd=apps/demo-api run db:migrate

  deploy-api:
    name: Deploy Hono API
    needs: [validate, migrate]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$DATABASE_URL"
      - name: Sync Worker database secret
        working-directory: apps/demo-api
        run: printf '%s' "$DATABASE_URL" | bunx wrangler secret put DATABASE_URL
      - name: Deploy API Worker
        run: bun --cwd=apps/demo-api run deploy
      - name: Verify API
        run: |
          curl --fail --retry-all-errors --retry 24 --retry-delay 5 --retry-max-time 120 \
            https://mmd-api.zyking.xyz/health
          curl --fail --retry-all-errors --retry 24 --retry-delay 5 --retry-max-time 120 \
            --header 'Content-Type: application/json' \
            --data '{"models":["Product"]}' \
            https://mmd-api.zyking.xyz/api/mmd/meta
      - name: Verify API under serial and concurrent requests
        run: bun apps/demo-api/scripts/verify-production.ts

  deploy-website:
    name: Deploy static website
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Check Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: bun --cwd=apps/website run build
      - name: Deploy website
        run: bun --cwd=apps/website run deploy
      - name: Verify website
        run: >-
          curl --fail --retry-all-errors --retry 24 --retry-delay 5
          --retry-max-time 120 https://mmd.zyking.xyz
