name: "Deploy MMD Production"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - configure-hyperdrive
          - update-hyperdrive

permissions:
  contents: write
  id-token: write

concurrency:
  group: mmd-production
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.4"

jobs:
  configure-hyperdrive:
    name: Configure Hyperdrive
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'configure-hyperdrive' ||
      inputs.operation == 'update-hyperdrive')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Create or explicitly update MMD Hyperdrive
        working-directory: apps/demo-api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPDATE_CONNECTION: "${{ inputs.operation == 'update-hyperdrive' }}"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$DATABASE_URL"

          name="mmd-postgres-prod"
          direct_database_url="$(bun -e '
            const value = Bun.env.DATABASE_URL;
            if (!value) throw new Error("DATABASE_URL is required");
            const url = new URL(value);
            url.hostname = url.hostname.replace("-pooler.", ".");
            process.stdout.write(url.toString());
          ')"

          find_id() {
            bunx wrangler hyperdrive list | awk -F '│' -v name="$name" '
              $3 ~ "^[[:space:]]*" name "[[:space:]]*$" {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }
            '
          }

          hyperdrive_id="$(find_id)"
          if [ -z "$hyperdrive_id" ]; then
            bunx wrangler hyperdrive create "$name" \
              --connection-string="$direct_database_url" \
              --sslmode=require \
              --origin-connection-limit=5 \
              --caching-disabled

            for _attempt in {1..6}; do
              hyperdrive_id="$(find_id)"
              [ -n "$hyperdrive_id" ] && break
              sleep 5
            done
          elif [ "$UPDATE_CONNECTION" = "true" ]; then
            bunx wrangler hyperdrive update "$hyperdrive_id" \
              --connection-string="$direct_database_url" \
              --sslmode=require \
              --origin-connection-limit=5 \
              --caching-disabled
          fi

          if [[ ! "$hyperdrive_id" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Unable to resolve the MMD Hyperdrive id" >&2
            exit 1
          fi

          echo "Hyperdrive ID: \`$hyperdrive_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit this ID to apps/demo-api/wrangler.jsonc before deployment." \
            >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate repository
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build

  publish-packages:
    name: Publish verified npm packages
    needs: validate
    uses: ./.github/workflows/publish-npm.yml
    with:
      publish: true
    secrets: inherit

  migrate:
    name: Migrate Neon database
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check database credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "$DATABASE_URL"
      - name: Migrate database through direct connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          direct_database_url="$(bun -e '
            const value = Bun.env.DATABASE_URL;
            if (!value) throw new Error("DATABASE_URL is required");
            const url = new URL(value);
            url.hostname = url.hostname.replace("-pooler.", ".");
            process.stdout.write(url.toString());
          ')"
          DATABASE_URL="$direct_database_url" bun --cwd=apps/demo-api run db:migrate

  deploy-api:
    name: Deploy Hono API
    needs: [validate, migrate, publish-packages]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/demo-api
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          bunx wrangler whoami > /dev/null
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun --cwd=apps/demo-api run deploy
      - name: Remove legacy Worker database secret
        working-directory: apps/demo-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(bunx wrangler secret list --format json)"
          if jq -e 'any(.name == "DATABASE_URL")' \
            <<< "$secrets_json" > /dev/null; then
            printf 'y\n' | bunx wrangler secret delete DATABASE_URL
          fi
      - name: Verify API
        run: |
          curl --fail --retry-all-errors --retry 24 --retry-delay 5 --retry-max-time 120 \
            https://mmd-api.zyking.xyz/health
          curl --fail --retry-all-errors --retry 24 --retry-delay 5 --retry-max-time 120 \
            --header 'Content-Type: application/json' \
            --data '{"models":["Product"]}' \
            https://mmd-api.zyking.xyz/api/mmd/meta
      - name: Verify API under serial and concurrent requests
        run: bun apps/demo-api/scripts/verify-production.ts

  deploy-website:
    name: Deploy static website
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/demo-api
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          bunx wrangler whoami > /dev/null
      - run: bun --cwd=apps/website run build
      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun --cwd=apps/website run deploy
      - name: Verify website
        run: >-
          curl --fail --retry-all-errors --retry 24 --retry-delay 5
          --retry-max-time 120 https://mmd.zyking.xyz

      - name: Verify released guides and interactive demos
        env:
          MMD_TEST_BASE_URL: https://mmd.zyking.xyz
        run: |
          bunx playwright install --with-deps chromium
          bun run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-failure
          path: test-results/
          if-no-files-found: ignore
      - name: Create versioned GitHub release after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/mmd-renderer/package.json)"
          tag="v$version"
          # JavaScript template interpolation must remain literal to the shell.
          # shellcheck disable=SC2016
          bun -e '
            const version = JSON.parse(await Bun.file("packages/mmd-renderer/package.json").text()).version;
            const log = await Bun.file("CHANGELOG.md").text();
            const section = log.split(`## [${version}]`)[1]?.split("\n## [")[0];
            if (!section) throw new Error("Missing release notes");
            await Bun.write("/tmp/mmd-release-notes.md", `## ${version}${section}\n\n[Docs](https://mmd.zyking.xyz/docs/) · [Demo](https://mmd.zyking.xyz/playground/embedded/) · [Changelog](https://mmd.zyking.xyz/changelog/)\n`);
          '
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already has a release."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "MMD $version" --notes-file /tmp/mmd-release-notes.md
          fi
